# Файл docker-compose.yml
volumes:
  pg_data:
  # Новый volume — для статических файлов
  static:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend/
    env_file: .env
    environment:
      DJANGO_STATIC_ROOT: /backend_static/static
    volumes:
      - static:/backend_static
      - media:/app/media
  frontend:
    env_file: .env
    build: ./frontend/
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
  gateway:
    build: ./gateway/
    volumes:
      - static:/staticfiles:ro
      - media:/media:ro
    ports:
      - 8000:80
